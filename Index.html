<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختبار الأسماء الموصولة</title>
<style>
:root{--green:#22c55e;--red:#ef4444;--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--blue:#4f46e5}
*{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif}
body{background:var(--bg);color:var(--text);padding:16px;min-height:100vh}
.wrap{max-width:640px;margin:auto}
h1{font-size:22px;text-align:center;margin:8px 0 2px}
.sub{color:var(--muted);text-align:center;font-size:13px;margin-bottom:16px}
.progress{color:var(--muted);font-size:14px;margin-bottom:10px}
.qtext{font-size:19px;font-weight:700;line-height:1.9;margin-bottom:14px}
.opt{background:var(--card);border:2px solid transparent;border-radius:14px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.opt .lt{font-weight:700;font-size:16px;line-height:1.7}
.opt .ex{display:none;color:var(--muted);font-size:13.5px;line-height:1.8;margin-top:8px;border-top:1px dashed #334155;padding-top:8px}
.opt.correct{border-color:var(--green);background:rgba(34,197,94,.12)}
.opt.wrong{border-color:var(--red);background:rgba(239,68,68,.12)}
.answered .opt{cursor:default}
.answered .opt .ex{display:block}
.verdict{font-weight:800;font-size:17px;margin:6px 0 12px;display:none}
.verdict.ok{color:var(--green);display:block}
.verdict.no{color:var(--red);display:block}
button.next{display:none;width:100%;background:var(--blue);color:#fff;border:0;border-radius:999px;padding:14px;font-size:17px;font-weight:700;cursor:pointer}
button.next.show{display:block}
.result{text-align:center;padding:30px 10px}
.result .score{font-size:44px;font-weight:900;color:var(--green)}
#print{display:none}
@media print{
 body{background:#fff;color:#000;padding:0}
 #screen{display:none}#print{display:block}
 @page{size:A4;margin:12mm}
 .qpage{page-break-after:always;padding:8mm 2mm}
 .qpage:last-child{page-break-after:auto}
 .pnum{color:#555;font-size:11pt;margin-bottom:3mm}
 .pq{font-size:15pt;font-weight:800;margin-bottom:6mm;line-height:1.8}
 .popt{border:1.2pt solid #bbb;border-radius:4pt;padding:3mm 4mm;margin-bottom:3mm;line-height:1.7;font-size:12pt}
 .popt .ex{display:block;color:#444;font-size:10.5pt;margin-top:2mm}
 .popt.correct{border:2pt solid #16a34a;background:#f0fdf4}
}
</style>
</head>
<body>
<div class="wrap" id="screen">
<h1>اختبار الأسماء الموصولة</h1>
<p class="sub">اضغط على أي خيار لعرض الإجابة الصحيحة مع شرح كل خيار</p>
<div id="game"></div>
</div>
<div id="print"></div>
<script>
const L=["أ","ب","ج","د"];
const QUIZ=[
{q:"أي من الأسماء الموصولة التالية يُعتبر معرباً وليس مبنياً؟",a:[["الذي","اسم الموصول للمفرد المذكر مبني على السكون في محل رفع أو نصب أو جر."],["الذين","اسم الموصول لجمع المذكر مبني دائماً على الفتح في لغة جمهور العرب."],["اللاتي","اسم الموصول لجمع المؤنث مبني دائماً ولا يتغير آخره بتغير موقعه الإعرابي."],["اللذان","الأسماء الموصولة كلها مبنية باستثناء المثنى (اللذان واللتان) فإنهما يعربان إعراب المثنى."]],c:3},
{q:"ما هي الحالة الإعرابية التي تظهر فيها (الذين) بالواو (الذون) عند قبيلتي هذيل وعقيل؟",a:[["حالة الجر","في الجر، تُستخدم الياء كبقية العرب."],["حالة النصب","هذيل وعقيل يلتزمون بالياء في حالتي النصب والجر فقط."],["جميع الحالات الإعرابية","التغيير يقتصر على حالة الرفع فقط، بينما تبقى الياء في النصب والجر."],["حالة الرفع","تنفرد قبيلتا هذيل وعقيل باستخدام الواو في جمع المذكر الموصول في حالة الرفع حصراً."]],c:3},
{q:"متى تكون (ألْ) اسماً موصولاً وليست حرفاً للتعريف؟",a:[["إذا دخلت على وصف صريح لغير تفضيل","يُشترط في (أل) الموصولية أن تدخل على مشتقات معينة كاسم الفاعل والمفعول."],["إذا دخلت على اسم تفضيل مثل (الأفضل)","دخول (أل) على اسم التفضيل يخرجها من باب الموصولية لتصبح حرف تعريف."],["إذا دخلت على فعل مضارع","الأصل في (أل) الموصولية الدخول على الأسماء المشتقة وليس الأفعال."],["إذا دخلت على اسم جامد مثل (الرجل)","عند دخولها على الأسماء الجامدة تعتبر (أل) حرف تعريف للعهد أو الجنس."]],c:0},
{q:"ما هو الشرط الأساسي لاعتبار (ذا) اسماً موصولاً؟",a:[["أن تكون مسبوقة بـ (ما) أو (مَن) الاستفهامية","لكي لا تلتبس بـ (ذا) الإشارية، يجب أن تسبقها أداة استفهام معينة لتؤدي معنى (الذي)."],["أن تكون بمعنى اسم الإشارة","إذا كانت بمعنى اسم الإشارة فهي ليست موصولية، والموصولية تتطلب معنى (الذي)."],["أن تدخل على اسم فاعل صريح","هذا الشرط يخص (أل) الموصولية وليس (ذا)."],["أن تأتي في بداية الجملة دائماً","موقعها في الجملة لا يحدد نوعها بقدر ما يحدده ما يسبقها من أدوات."]],c:0},
{q:"بماذا تُعلل العرب تشديد النون في (اللذانِّ) و(اللتانِّ)؟",a:[["للدلالة على حالة النصب والجر","التشديد قد يظهر في حالة الرفع أيضاً ولا يختص بالنصب والجر."],["لأنها أسماء مبنية دائماً","المثنى من الأسماء الموصولة معرب، والتشديد لا علاقة له بالبناء."],["للتمييز بين المذكر والمؤنث","التشديد يلحق اللفظين معاً ولا يعمل كأداة تمييز جندري."],["تعويضاً عن الياء المحذوفة","يجوز في لغة العرب تشديد النون المكسورة لتعويض النقص الناتج عن حذف الياء من أصل الكلمة."]],c:3},
{q:"ما الفرق الجوهري بين (مَنْ) و(مَا) في باب الأسماء الموصولة المشتركة؟",a:[["مَنْ للعاقل غالباً، ومَا لغير العاقل غالباً","هذا هو التقسيم الاستعمالي الغالب في اللغة العربية للتفرقة بين ذوي العقل وغيرهم."],["مَنْ للمثنى، ومَا للجمع","كلتاهما تستخدم للمفرد والمثنى والجمع بلفظ واحد."],["مَنْ مختصة، ومَا عامة","كلاهما يندرج تحت قسم الأسماء الموصولة العامة (المشتركة)."],["مَنْ معربة، ومَا مبنية","كلا الاسمين مبنيان على السكون دائماً."]],c:0},
{q:"أي من الألفاظ التالية يُعد اسماً موصولاً خاصاً بجمع الذكور عند جمهور العرب؟",a:[["ذو","هي اسم موصول مشترك في لغة طيئ فقط."],["الأُلى","لفظ (الأُلى) يُستخدم لجمع المذكر والمؤنث وهو من الأسماء الموصولة المختصة بالجمع."],["اللائي","هذا اللفظ يختص بجمع المؤنث فقط."],["أيّ","تُعتبر (أيّ) من الأسماء الموصولة المشتركة وليست المختصة."]],c:1},
{q:"ما هي لغة قبيلة (طيّئ) فيما يخص الأسماء الموصولة؟",a:[["إعراب جميع الأسماء الموصولة","الأصل في الأسماء الموصولة البناء، ولا توجد قبيلة تعربها جميعاً."],["تشديد النون في المفرد","التشديد يكون في النون المكسورة للمثنى وليس للمفرد."],["استخدام (ذا) بدون شرط الاستفهامية","هذا قول يُنسب للكوفيين وليس لطيئ."],["استخدام (ذو) بلفظ واحد للجميع","تنفرد قبيلة طيئ باستخدام (ذو) كاسم موصول مبني بمعنى (الذي) لكل الأنواع."]],c:3},
{q:"أي الكلمات التالية تخرج عن كون (أل) فيها موصولية؟",a:[["المضروب","اسم المفعول يعتبر وصفاً صريحاً تكتسب فيه (أل) صفة الموصولية."],["الأعلى","بما أن (الأعلى) اسم تفضيل، فإن (أل) الداخلة عليه هي حرف تعريف وليست اسماً موصولاً."],["الضارب","اسم الفاعل وصف صريح يقع صلة لـ (أل) الموصولية."],["الحسن","وصف صريح (صفة مشبهة)، لذا (أل) فيها موصولية."]],c:1},
{q:"ما هو إعراب (اللذين) و(اللتين) في حالتي النصب والجر؟",a:[["مبني على الياء","المثنى من الموصولات لا يُبنى بل يُعرب إعراب المثنى."],["معرب بالحروف (الياء)","باعتبارهما مثنى، فإنهما ينصبان ويجران بالياء ويرفعان بالألف."],["مبني على الفتح","البناء على الفتح يخص جمع المذكر (الذين) وليس المثنى."],["معرب بالحركات المقدرة","تظهر علامات الإعراب في المثنى من خلال الحروف (ألف وياء) وليس الحركات المقدرة."]],c:1},
{q:"إذا لم تُسبق (ذا) بـ (ما) أو (مَن) الاستفهامية، فماذا تُعتبر عند جمهور النحاة؟",a:[["ضميراً متصلاً","اسم ظاهر مستقل ولا تُعتبر ضميراً (ذا)."],["حرف تعريف","حرف التعريف هو (أل) فقط، ولا يمكن لـ (ذا) أن تكون حرفاً."],["اسم إشارة","في حال غياب الاستفهام، تعود (ذا) لأصلها كاسم إشارة (مثل: هذا)."],["اسماً موصولاً عاماً","الاسم الموصول العام يشترط فيه سبق الاستفهامية لـ (ذا)."]],c:2},
{q:"ما هو (الوصف الصريح) الذي تُشترط فيه (أل) الموصولية؟",a:[["اسم الفاعل واسم المفعول والصفة المشبهة","هذه الثلاثة هي المشتقات التي تؤهل (أل) للعمل كاسم موصول."],["أسماء الأفعال","أسماء الأفعال لا تندرج تحت مسمى الوصف الصريح."],["المصدر الصريح والمؤول","المصدر ليس وصفاً بل هو اسم يدل على الحدث المجرد."],["اسم الزمان واسم المكان","أسماء الزمان والمكان لا تعتبر من الوصف الصريح المقصود في هذا الباب."]],c:0},
{q:"لماذا لا تختلف (ذو) الموصولية في لغة طيئ عند استخدامها للمفرد أو الجمع؟",a:[["لأنها مبنية على السكون دائماً وتلزم لفظاً واحداً","في هذا السياق اسم موصول مشترك يلزم حالة واحدة لكل الأجناس والأعداد."],["لأنها تُعامل معاملة الأسماء الخمسة","بمعنى صاحب هي التي تعامل كالأسماء الخمسة، أما (ذو) الموصولية فمبنية."],["لأنها تتبع حركة ما قبلها","البناء على السكون يمنعها من التأثر بحركة ما قبلها إعرابياً."],["لأنها معربة بالحركات","الطائية مبنية وليست معربة (ذو)."]],c:0},
{q:"في قوله تعالى: {مَاذَا أَنْزَلَ رَبُّكُمْ}، ما هو التوجيه الإعرابي لـ (ذا) باعتبارها اسماً موصولاً؟",a:[["أنها حرف استفهام زائد","لا تأتي حرفاً بل هي اسم دائماً (ذا)."],["أنها خبر للمبتدأ (ما)","هذا وجه إعرابي وارد، لكن السؤال يسأل عن هويتها كاسم موصول."],["أنها اسم إشارة مبني","بما أنها مسبوقة بـ (ما) الاستفهامية، فيمكن اعتبارها موصولية بمعنى (الذي)."],["أنها اسم موصول مسبوق بـ (ما) الاستفهامية","تقع هنا اسماً موصولاً بمعنى (الذي) لوقوعها بعد (ما) الاستفهامية."]],c:3},
{q:"أي من الأسماء الموصولة التالية يُستخدم لجمع المؤنث؟",a:[["اللذان","هذا خاص بالمثنى المذكر."],["اللائي","(اللائي) و(اللاتي) هما اللفظان المختصان بجمع الإناث."],["الذين","هذا خاص بجمع المذكر."],["الأُلى","رغم أنها قد تُستخدم للمؤنث أحياناً، إلا أن (اللائي) أكثر اختصاصاً في التقسيم الثنائي."]],c:1},
{q:"ما هو مذهب الكوفيين في كلمة (ذا) الموصولية؟",a:[["أوجبوا إعرابها بالحركات","الأسماء الموصولة العامة مبنية عند جميع المذاهب."],["أجازوا كونها موصولة دون شرط سبقها بـ (ما) أو (من)","خالف الكوفيون الجمهور وأجازوا موصولية (ذا) حتى لو لم تسبقها أداة استفهام."],["اشترطوا أن تكون للمثنى فقط","الموصولية عند الجميع لفظ واحد للكل (ذا)."],["منعوا استخدامها كاسم موصول مطلقاً","على العكس، الكوفيون كانوا أكثر توسعاً في إجازة موصوليتها."]],c:1},
{q:"في الجملة: (يعجبني من جاءك)، ما هو الاسم الموصول ونوعه؟",a:[["اسم موصول مختص - (من)","ليست مختصة بنوع بل تستخدم بلفظ واحد للجميع (من)."],["اسم استفهام - (من)","رغم أنها تشبه الاستفهامية، إلا أنها هنا بمعنى (الذي) فهي موصولية."],["اسم موصول - (جاءك)","جملة فعلية هي صلة الموصول وليست الاسماً نفسه (جاءك)."],["اسم موصول مشترك (عام) - (من)","تندرج تحت الأسماء التي تستخدم للمفرد والجمع والمذكر والمؤنث بلفظ واحد (من)."]],c:3},
{q:"لماذا لا تُعتبر (أل) في كلمة (الرجل) اسماً موصولاً؟",a:[["لأنها معرفة بالكسرة","حركة الاسم لا تحدد نوع (أل)."],["لأنها في بداية الجملة","الموقع الإعرابي لا يؤثر في نوع (أل)."],["لأن (الرجل) ليس مثنى","الموصولية تدخل على المفرد والمثنى والجمع إذا تحقق شرط الوصف."],["لأنها دخلت على اسم جامد","شرط موصولية (أل) دخولها على مشتق (وصف صريح)، والرجل اسم ذات جامد."]],c:3},
{q:"أي من الجمل التالية تشتمل على اسم موصول مشترك لغير العاقل؟",a:[["أعجبني مَنْ نجح","تُستخدم غالباً للعاقل (من)."],["جاء اللذان فازا","اسم موصول مختص بالمثنى (اللذان)."],["الذي اشتريته جميل","اسم موصول مختص وليس مشتركاً (الذي)."],["ما عندكم ينفد","هي الاسم الموصول المشترك المخصص لغير العاقل (ما)."]],c:3},
{q:"ما حكم الأسماء الموصولة (الذي، التي، الذين) من حيث البناء والإعراب؟",a:[["معربة دائماً","هذه الأسماء تلزم حالة واحدة ولا تتغير حركاتها، فهي مبنية."],["معربة بحركات مقدرة","المبني لا يُقال عنه معرب بحركات مقدرة بل مبني في محل."],["مبنية في الرفع معربة في النصب","البناء لا يتجزأ حسب الحالات الإعرابية."],["مبنية دائماً","الأصل في هذه الأسماء الموصولة المختصة (غير المثناة) هو البناء."]],c:3}
];
let i=0,score=0,answered=false;
const game=document.getElementById("game");
function render(){
 answered=false;
 const q=QUIZ[i];
 game.innerHTML='<div class="progress">السؤال '+(i+1)+' / '+QUIZ.length+'</div><div class="qtext">'+q.q+'</div><div id="opts">'+
 q.a.map((o,oi)=>'<div class="opt" data-i="'+oi+'"><div class="lt">'+L[oi]+'. '+o[0]+'</div><div class="ex">الشرح: '+o[1]+'</div></div>').join('')+
 '</div><div class="verdict" id="verdict"></div><button class="next" id="next">'+(i===QUIZ.length-1?'عرض النتيجة':'السؤال التالي ←')+'</button>';
 document.querySelectorAll('.opt').forEach(el=>el.addEventListener('click',pick));
 document.getElementById('next').addEventListener('click',next);
}
function pick(e){
 if(answered)return;answered=true;
 const oi=+e.currentTarget.dataset.i,q=QUIZ[i],opts=document.getElementById('opts');
 opts.classList.add('answered');
 opts.children[oi].classList.add(oi===q.c?'correct':'wrong');
 if(oi===q.c)score++;else opts.children[q.c].classList.add('correct');
 const v=document.getElementById('verdict');
 v.textContent=oi===q.c?'✅ إجابة صحيحة!':'❌ إجابة خاطئة — الإجابة الصحيحة: '+L[q.c]+'. '+q.a[q.c][0];
 v.className='verdict '+(oi===q.c?'ok':'no');
 document.getElementById('next').classList.add('show');
}
function next(){
 if(i<QUIZ.length-1){i++;render();}
 else{game.innerHTML='<div class="result"><div class="progress">النتيجة النهائية</div><div class="score">'+score+' / '+QUIZ.length+'</div><p class="sub" style="margin:12px 0 20px">'+(score>=15?'ممتاز! إتقان رائع للأسماء الموصولة':score>=10?'جيد جداً! راجع الشروح ثم أعد المحاولة':'راجع القاعدة وأعد المحاولة')+'</p><button class="next show" onclick="location.reload()">إعادة الاختبار</button></div>';}
}
document.getElementById('print').innerHTML=QUIZ.map((q,qi)=>'<div class="qpage"><div class="pnum">السؤال '+(qi+1)+' / 20</div><div class="pq">'+q.q+'</div>'+q.a.map((o,oi)=>'<div class="popt'+(oi===q.c?' correct':'')+'"><b>'+L[oi]+'. '+o[0]+(oi===q.c?' ✅':'')+'</b><span class="ex">الشرح: '+o[1]+'</span></div>').join('')+'</div>').join('');
render();
</script>
</body>
</html>
